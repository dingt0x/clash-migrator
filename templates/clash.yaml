mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: rule
log-level: error
# external-controller: '127.0.0.1:9090'
sniffer:
    enable: true
    force-dns-mapping: true
    parse-pure-ip: true
    override-destination: true
    sniff: { HTTP: { ports: [80, 8080-8880], override-destination: true }, TLS: { ports: [443, 8443] }, QUIC: { ports: [443, 8443] } }
    force-domain: [+.openai.com]
    skip-domain: ['Mijia Cloud']
dns:
    enable: true
    ipv6: false
    default-nameserver: ['tcp://223.5.5.5', 'tls://223.5.5.5']
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    fake-ip-filter:
    - '+.cn'
    - '+.lan'
    - '+.linksys.com'
    - '+.pool.ntp.org'
    - '+.ptlogin2.qq.com'
    - '+.tindings.fun'
    - '+.gehealthcare.com'
    - '+.myDS.me'
    - '+.FamilyDS.com'
    - '+.lambda-url.ap-northeast-1.on.aws'
    nameserver: ['https://dns.alidns.com/dns-query']
    fallback: ['https://doh.pub/dns-query', 'https://dns.google/dns-query']
    fallback-filter: { geoip: true, ipcidr: [240.0.0.0/4, 0.0.0.0/32] }
proxies: []
proxy-groups:
    - { name: '♻️ 自动选择', type: url-test, proxies: [],tolerance: 50, lazy: true, url: 'http://www.gstatic.com/generate_204', interval: 150 }
#    - { name: '🇯🇵 日本', type: select, proxies: [] }
#    - { name: '🇯🇵 日本 ♻️ 自动选择', type: url-test, proxies: [],tolerance: 50, lazy: true, url: 'http://www.gstatic.com/generate_204', interval: 150 }
#    - { name: '🇺🇸 美国', type: select, proxies: [] }
    - { name: '🔰 手动选择', type: select, proxies: ['♻️ 自动选择'] }
    - { name: '⚛️ AI', type: select, proxies: ['🔰 手动选择', '♻️ 自动选择' ] }
    - { name: '🎬 Movies and TV', type: select, proxies: ['🔰 手动选择', '♻️ 自动选择' ] }
    - { name: 'Ⓜ️ 微软服务', type: select, proxies: [DIRECT, '🔰 手动选择', '♻️ 自动选择'] }
    - { name: '🍎 Apple', type: select, proxies: [DIRECT, '🔰 手动选择', '♻️ 自动选择' ] }
    - { name: '🎯 游戏平台', type: select, proxies: [DIRECT, '🔰 手动选择', '♻️ 自动选择' ] }
    - { name: '🌎 全球代理', type: select, proxies: ['🔰 手动选择', '♻️ 自动选择' ] }
    - { name: '🛑 广告拦截', type: select, proxies: [REJECT, DIRECT, '🔰 手动选择', '♻️ 自动选择'] }
    - { name: '🐟 漏网之鱼', type: select, proxies: [DIRECT, '🔰 手动选择', '♻️ 自动选择'] }
rules: []
rule-providers: []
